name: Auto grade Assignment

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        default: ".hyf"
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # actions/checkout needs this for private repos
      pull-requests: write
      issues: write

    steps:
      # Checkout the trainee's assignment code (fork PR head).
      # pull_request_target is required so we can comment scores on fork PRs.
      # actions/checkout v6+ refuses fork checkouts here unless we opt in.
      # We intentionally execute the student's .hyf/test.sh next; keep the
      # GITHUB_TOKEN least-privilege (contents:read, no extra secrets) and
      # do not persist credentials into the student tree.
      # See https://gh.io/securely-using-pull_request_target
      - name: Checkout assignment code
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: assignment
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      # Checkout the grading workflow scripts
      - name: Checkout workflow scripts
        uses: actions/checkout@v6
        with:
          repository: HackYourFuture/github-actions
          path: workflow-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      # Run the tests from the assignment directory
      - name: Run tests
        working-directory: assignment/${{ inputs.working-directory }}
        run: bash test.sh > test-output.txt 2>&1

      # Post the test results as a comment on the PR
      - name: Comment PR
        uses: actions/github-script@v8
        with:
          script: |
            const path = require('path');
            const run = require(path.join(process.env.GITHUB_WORKSPACE, 'workflow-scripts/workflow-scripts/comment-pr.js'));
            process.chdir(path.join(process.env.GITHUB_WORKSPACE, 'assignment'));
            await run({ github, context, core });

      - name: Fail if tests failed
        run: |
          PASS=$(jq -r '.pass' assignment/${{ inputs.working-directory }}/score.json)
          if [ "$PASS" != "true" ]; then
            exit 1
          fi
